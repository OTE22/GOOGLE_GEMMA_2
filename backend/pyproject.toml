[project]
name = "backend"
version = "0.1.0"
description = "Native EmbeddingGemma 2 multimodal search and evidence RAG laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=18.1.0",
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "librosa>=0.11.0",
    "openai>=3.28.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
