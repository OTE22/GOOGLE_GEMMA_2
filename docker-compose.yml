services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      CHROMA_PATH: /app/data/chroma
      UPLOAD_DIR: /app/data/uploads
      HF_HOME: /app/data/huggingface
    volumes:
      - vectors:/app/data/chroma
      - uploads:/app/data/uploads
      - models:/app/data/huggingface
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  vectors:
  uploads:
  models:
